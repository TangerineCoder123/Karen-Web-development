<html>
    <head>
        <title>My Superhero Card</title>
        <style>
            body {
                background-color: darkblue;
                color: white;
                font-family: Arial, sans-serif;
            }

            .hero-name {
                font-size: 60px;
                font-weight: bold;
                color: yellow;
                text-shadow: 3px 3px orange
            }

            .tagline {
                font-style: italic;
                color: lightblue;
                text-transform: capitalize;
            }

            .label {
                text-transform: uppercase;
                text-decoration:underline, overline;
                color: coral;
            }

            .power {
                font-weight: bold;
                color: lightgreen;
                font-family: Comic;
            }

            .weakness {
                text-decoration: line-through;
                color: gray
            }

            .bage {
                font-size: 28px;
                font-weight: bold;
                color: gold;
                transform: rotate(15deg);
            }

            .made-by {
                color: coral;
                font-style: italic;
            }

            .Cow {
                color: purple;
                font-style: monospace;
            }


        </style>
    </head>
    <body>

        <h1 class="hero-name">Thunder Kid</h1>
        <p class="tagline">The most powerful hero in the whole school</p>

        <h2 class="label">super powers</h2>
        <p class="power">Can run faster than a cheetah</p>
        <p class="power">Can lift a school bus</p>
        <p class="power">Can backflip</p>

        <h2 class="label">weaknesses</h2>
        <p class="weakness">Maths homework</p>
        <p class="weakness">Broccoli</p>
        <p class="weakness">Exercising</p>

        <p class="bage">Top Hero</p>
        <h3 class="Cow">Beating villains, Saving lives</h3>

        <p class="made-by">Created by ______________</p>

    </body>
</html>
